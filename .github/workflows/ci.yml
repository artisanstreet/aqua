name: ci
on:
  push:
  pull_request:
defaults:
  run:
    shell: bash
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: fmt
        run: cargo fmt --check
      - name: workspace tests
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace --locked -- --nocapture --test-threads=1
      - name: clippy (all targets)
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: windows cross-check (whole workspace, all targets)
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
