name: ci
on:
  push:
  pull_request:
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: artisan-sccache
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: 'true'
  SCCACHE_S3_KEY_PREFIX: rust
  SCCACHE_S3_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID || secrets.SCCACHE_R2_READ_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || secrets.SCCACHE_R2_READ_SECRET_ACCESS_KEY }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config mesa-vulkan-drivers libvulkan-dev \
            vulkan-validationlayers vulkan-tools spirv-tools sway grim dbus at-spi2-core xkb-data adwaita-icon-theme
      - name: pinned DXC with SPIR-V codegen
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o "$RUNNER_TEMP/dxc.tar.gz" https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz
          echo "96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1  $RUNNER_TEMP/dxc.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dxc"
          tar -xzf "$RUNNER_TEMP/dxc.tar.gz" -C "$RUNNER_TEMP/dxc"
          echo "AQUA_DXC_SPIRV=$RUNNER_TEMP/dxc/bin/dxc" >> "$GITHUB_ENV"
      - name: Linux toolchain probes (SPIR-V, lavapipe, headless sway)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: scripts/linux-env.sh
      - name: fmt
        run: cargo fmt --check
      - name: fetch dependencies for every platform
        run: cargo fetch --locked
      - name: procdump for the test watchdog
        if: runner.os == 'Windows'
        run: |
          curl -sSL -o "$RUNNER_TEMP/Procdump.zip" https://download.sysinternals.com/files/Procdump.zip
          if echo "5fe68e81632f13188930affff20a9a9910170bae654360850d3108cead708a2d  $RUNNER_TEMP/Procdump.zip" | sha256sum --check --status; then
            pwsh -NoProfile -Command "Expand-Archive -Force -Path '$(cygpath -w "$RUNNER_TEMP/Procdump.zip")' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/procdump")'"
            echo "PROCDUMP=$(cygpath -w "$RUNNER_TEMP/procdump/procdump64.exe")" >> "$GITHUB_ENV"
          else
            echo "::warning::Procdump.zip no longer matches the pinned SHA-256; update the hash in ci.yml. The test watchdog falls back to cdb."
          fi
      - name: workspace tests
        env:
          CARGO_BUILD_JOBS: 2
          AQUA_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
          VK_ICD_FILENAMES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.x86_64.json' || '' }}
          AQUA_REQUIRE_WAYLAND: ${{ runner.os == 'Linux' && '1' || '0' }}
          AQUA_REQUIRE_DBUS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          if [ "$RUNNER_OS" != Windows ]; then
            exec cargo test --workspace --locked -- --nocapture --test-threads=1
          fi
          stop="$RUNNER_TEMP/test-watchdog.stop"
          pwsh -NoProfile -File .github/scripts/test-watchdog.ps1 \
            -TargetDir "$(cygpath -w "$GITHUB_WORKSPACE/target")" \
            -OutDir "$(cygpath -w "$RUNNER_TEMP/test-hangs")" \
            -StopFile "$(cygpath -w "$stop")" \
            -LimitMinutes 10 \
            -ProcDump "${PROCDUMP:-}" &
          watchdog=$!
          status=0
          cargo test --workspace --locked -- --nocapture --test-threads=1 || status=$?
          touch "$stop"
          wait "$watchdog" || true
          exit "$status"
      - name: upload hung test dumps
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: test-hangs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-hangs
          if-no-files-found: ignore
          retention-days: 14
      - name: clippy (all targets)
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: windows cross-check (whole workspace, all targets)
        env:
          AQUA_SHADERS_SKIP: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        run: '"$SCCACHE_PATH" --show-stats'
