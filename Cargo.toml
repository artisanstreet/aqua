[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.93"

[workspace.dependencies]
aqua-core = { path = "crates/aqua-core" }
aqua-reactive = { path = "crates/aqua-reactive" }
aqua-ui = { path = "crates/aqua-ui" }
aqua-style = { path = "crates/aqua-style" }
aqua-layout = { path = "crates/aqua-layout" }
aqua-text = { path = "crates/aqua-text" }
aqua-scene = { path = "crates/aqua-scene" }
aqua-protocol = { path = "crates/aqua-protocol" }
aqua-runtime = { path = "crates/aqua-runtime" }
taffy = "0.15"
