[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.93"

[workspace.dependencies]
aqua-core = { path = "crates/aqua-core" }
aqua-reactive = { path = "crates/aqua-reactive" }
aqua-ui = { path = "crates/aqua-ui" }
aqua-text = { path = "crates/aqua-text" }
aqua-render = { path = "crates/aqua-render" }
aqua-scene = { path = "crates/aqua-scene" }
aqua-platform = { path = "crates/aqua-platform" }
wgpu = "30"
glyphon = "0.12"
cosmic-text = "0.19"
winit = "0.30"
taffy = "0.15"
