[package]
name = "aqua-fonts-system"
version = "0.1.0"
edition = "2024"
description = "Aqua system font discovery: memory-mapped faces shared between shaping and rasterization"
license = "BSD-3-Clause"

[features]
testing = []

[dependencies]
skrifa = "0.46.2"
memmap2 = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
thiserror = "2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFLocale", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontManager"] }
