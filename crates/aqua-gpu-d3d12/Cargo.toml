[package]
name = "aqua-gpu-d3d12"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aqua native D3D12 GpuBackend: placed transients, instanced SDF quads, layer compositing"

[dependencies]
aqua-core = { path = "../aqua-core" }
aqua-graph = { path = "../aqua-graph" }
aqua-protocol = { path = "../aqua-protocol" }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
aqua-shaders = { path = "../aqua-shaders" }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
aqua-shell-win32 = { path = "../aqua-shell-win32" }
windows = { version = "0.62.2", features = [
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
aqua-media = { path = "../aqua-media" }
aqua-gpu-ref = { path = "../aqua-gpu-ref" }
