[package]
name = "aqua-gpu-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aqua Metal GpuBackend for macOS on Apple Silicon: objc2-metal, MSL built from the shared HLSL through SPIR-V and SPIRV-Cross, pooled transients"

[dependencies]
aqua-core = { path = "../aqua-core" }
aqua-graph = { path = "../aqua-graph" }
aqua-protocol = { path = "../aqua-protocol" }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
aqua-shaders = { path = "../aqua-shaders" }
thiserror = "2"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSString",
  "NSArray",
  "NSObject",
  "NSDictionary",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLBlitCommandEncoder",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLLibrary",
  "MTLPipeline",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResource",
  "MTLSampler",
  "MTLTexture",
  "MTLTypes",
  "MTLVertexDescriptor",
  "objc2-core-foundation",
] }

[dev-dependencies]
aqua-gpu-ref = { path = "../aqua-gpu-ref" }
aqua-verify = { path = "../aqua-verify" }
