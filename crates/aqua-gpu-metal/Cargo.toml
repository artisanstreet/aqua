[package]
name = "aqua-gpu-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aqua Metal GpuBackend for macOS on Apple Silicon: objc2-metal, MSL built from the shared HLSL through SPIR-V and SPIRV-Cross, pooled transients"

[dependencies]
aqua-core = { path = "../aqua-core" }
aqua-graph = { path = "../aqua-graph" }
aqua-protocol = { path = "../aqua-protocol" }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
aqua-shaders = { path = "../aqua-shaders" }
thiserror = "2"
block2 = "0.6.2"
libloading = "0.8"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-metal",
  "CALayer",
  "CAMetalLayer",
  "CATransaction",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSString",
  "NSArray",
  "NSObject",
  "NSDictionary",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLBlitCommandEncoder",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLDrawable",
  "MTLLibrary",
  "MTLPipeline",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResource",
  "MTLSampler",
  "MTLTexture",
  "MTLTypes",
  "MTLVertexDescriptor",
  "block2",
  "objc2-core-foundation",
] }

[dev-dependencies]
aqua-gpu-ref = { path = "../aqua-gpu-ref" }
aqua-verify = { path = "../aqua-verify" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
aqua-shell-appkit = { path = "../aqua-shell-appkit", features = ["testing"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "window"
path = "tests/window/main.rs"
harness = false
