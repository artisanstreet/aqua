[package]
name = "aqua-ime-tsf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Aqua Text Services Framework adapter: composition, candidate positioning, reconversion, UTF-16 ranges"

[features]
double = []

[dependencies]
aqua-core = { path = "../aqua-core" }
aqua-protocol = { path = "../aqua-protocol" }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(windows)'.dev-dependencies]
aqua-runtime = { path = "../aqua-runtime" }
aqua-text = { path = "../aqua-text" }
aqua-ui = { path = "../aqua-ui" }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
