[package]
name = "aqua-macros"
version = "0.1.0"
edition = "2021"
description = "ui! declarative authoring macro for the Aqua GUI framework"
license = "BSD-3-Clause"

[lib]
proc-macro = true

[dependencies]
# Pinned to the workspace-agreed major (contract §0: syn 2 / quote 1 /
# proc-macro2 1, confirmed via `cargo info` on crates.io: syn 2.0.x latest).
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# Real-crate consumer tests (tests/real_mount.rs always active;
# tests/ui_facade.rs gated on `aqua-integration` until `aqua::ui` lands).
aqua = { path = "../aqua" }
aqua-ui = { path = "../aqua-ui" }
aqua-reactive = { path = "../aqua-reactive" }
aqua-core = { path = "../aqua-core" }

[features]
# Dormant until the tree (incl. aqua-text) is green. Then add to
# [dev-dependencies]:
# aqua = { path = "../aqua" }
# aqua-ui = { path = "../aqua-ui" }
# aqua-reactive = { path = "../aqua-reactive" }
# aqua-core = { path = "../aqua-core" }
# and run `cargo test --features aqua-integration`. See tests/ui_facade.rs.
# The deps are deliberately absent until then: building the test harness
# must not drag a broken peer crate into this crate's green suite.
aqua-integration = []
