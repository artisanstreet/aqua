[package]
name = "aqua-oracle-dwrite"
version = "0.1.0"
edition = "2024"
description = "Test-only DirectWrite oracle: shaping and pixel references for aqua-text"
license = "BSD-3-Clause"
publish = false

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Gdi",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
aqua-text = { path = "../aqua-text" }
aqua-media = { path = "../aqua-media" }
aqua-core = { path = "../aqua-core" }
aqua-graph = { path = "../aqua-graph" }
aqua-protocol = { path = "../aqua-protocol" }
aqua-gpu-d3d12 = { path = "../aqua-gpu-d3d12" }
aqua-gpu-ref = { path = "../aqua-gpu-ref" }
png = "0.18"
