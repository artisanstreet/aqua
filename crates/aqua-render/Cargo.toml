[package]
name = "aqua-render"
version = "0.1.0"
edition = "2021"
description = "Aqua shared wgpu 2D renderer: retained scene, damage tracking, effects, bounded resources"
license = "BSD-3-Clause"

[dependencies]
aqua-core = { path = "../aqua-core" }
aqua-scene = { path = "../aqua-scene" }
aqua-text = { path = "../aqua-text" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12"
cosmic-text = "0.19"
fontdb = "0.23"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }

resvg = "0.48.1"
kurbo = "0.13"
roxmltree = "0.21"
tiny-skia = "0.12"

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite", "Win32_Foundation"] }
