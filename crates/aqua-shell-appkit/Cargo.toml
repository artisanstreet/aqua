[package]
name = "aqua-shell-appkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Aqua AppKit shell: explicit-time run loop, NSWindow/NSView windows, backing scale, screens, occlusion, keyboard, mouse and scroll input, cursors, overlay chrome with traffic lights, layer leases, pasteboard, file drops, NSTextInputClient routing"

[features]
testing = []

[dependencies]
aqua-core = { path = "../aqua-core" }
aqua-protocol = { path = "../aqua-protocol" }
aqua-shell = { path = "../aqua-shell" }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSAttributedString",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSGeometry",
  "NSNotification",
  "NSObjCRuntime",
  "NSObject",
  "NSProcessInfo",
  "NSRange",
  "NSRunLoop",
  "NSString",
  "NSThread",
  "NSURL",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSAccessibilityProtocols",
  "NSAppearance",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSCursor",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFDate",
  "CFRunLoop",
  "CFString",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-metal",
  "CALayer",
  "CAMetalLayer",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
  "CGSession",
  "CGWindow",
] }

[dev-dependencies]
aqua-runtime = { path = "../aqua-runtime" }
aqua-shell-appkit = { path = ".", features = ["testing"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFDate",
  "CFRunLoop",
  "CFString",
] }

[[test]]
name = "looping"
harness = false

[[test]]
name = "windows"
harness = false

[[test]]
name = "chrome"
harness = false

[[test]]
name = "outputs"
harness = false

[[test]]
name = "keyboard"
harness = false

[[test]]
name = "input"
harness = false

[[test]]
name = "cursor"
harness = false

[[test]]
name = "clipboard"
harness = false

[[test]]
name = "drop"
harness = false
