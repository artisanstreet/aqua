[package]
name = "aqua-text"
version = "0.1.0"
edition = "2021"
description = "Aqua shared text infrastructure: font discovery, shaping, layout, rasterization, editing model"
license = "BSD-3-Clause"

[dependencies]
aqua-fonts-system = { path = "../aqua-fonts-system" }
harfrust = "0.12"
skrifa = "0.46.2"
zeno = "0.3"
png = "0.18"
aqua-media = { path = "../aqua-media" }
aqua-graph = { path = "../aqua-graph" }
aqua-core = { path = "../aqua-core" }
unicode-bidi = "0.3"
unicode-script = "0.5"
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1.12"

[dev-dependencies]
harfrust = "0.12"
