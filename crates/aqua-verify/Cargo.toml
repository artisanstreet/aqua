[package]
name = "aqua-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aqua verification: architecture enforcement, exact counters, heap gates, frame-time statistics and memory budgets"

[dependencies]
aqua-graph = { path = "../aqua-graph" }
aqua-gpu-ref = { path = "../aqua-gpu-ref" }
aqua-protocol = { path = "../aqua-protocol" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
aqua = { path = "../aqua" }
aqua-core = { path = "../aqua-core" }
aqua-kernels = { path = "../aqua-kernels" }
aqua-motion = { path = "../aqua-motion" }
aqua-runtime = { path = "../aqua-runtime" }
aqua-scene = { path = "../aqua-scene" }
aqua-text = { path = "../aqua-text" }
aqua-transport = { path = "../aqua-transport" }
aqua-ui = { path = "../aqua-ui" }

[target.'cfg(windows)'.dev-dependencies]
aqua-gpu-d3d11 = { path = "../aqua-gpu-d3d11" }
aqua-gpu-d3d12 = { path = "../aqua-gpu-d3d12" }
aqua-oracle-dwrite = { path = "../aqua-oracle-dwrite" }
aqua-media = { path = "../aqua-media" }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
