[package]
name = "aqua"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aqua public facade: application runtime, event orchestration, showcase examples"
rust-version.workspace = true

[dependencies]
aqua-core = { workspace = true }
aqua-protocol = { path = "../aqua-protocol" }
aqua-runtime = { path = "../aqua-runtime" }
aqua-reactive = { path = "../aqua-reactive" }
aqua-text = { path = "../aqua-text" }
aqua-fonts-system = { path = "../aqua-fonts-system" }
aqua-ui = { path = "../aqua-ui" }
aqua-graph = { path = "../aqua-graph" }
aqua-media = { path = "../aqua-media" }
aqua-motion = { path = "../aqua-motion" }
aqua-scene = { path = "../aqua-scene" }
aqua-transport = { path = "../aqua-transport" }
aqua-ime-tsf = { path = "../aqua-ime-tsf" }
aqua-gpu-ref = { path = "../aqua-gpu-ref" }
aqua-shell-win32 = { path = "../aqua-shell-win32" }

[target.'cfg(windows)'.dependencies]
aqua-gpu-d3d11 = { path = "../aqua-gpu-d3d11" }
aqua-gpu-d3d12 = { path = "../aqua-gpu-d3d12", optional = true }
aqua-a11y-uia = { path = "../aqua-a11y-uia" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }

[features]
d3d12 = ["dep:aqua-gpu-d3d12"]
probe-allocator = []
profile-alloc = []

[dev-dependencies]
taffy = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dev-dependencies]
aqua-gpu-d3d12 = { path = "../aqua-gpu-d3d12" }
serde_json = "1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "host_native"
harness = false

[[test]]
name = "host_windows"
harness = false

[[test]]
name = "host_ui_windows"
harness = false

[[test]]
name = "windows_desktop"
harness = false

[[test]]
name = "windows_text"
harness = false

[[test]]
name = "render_shared"
harness = false

[[test]]
name = "host_trim"
harness = false

[[test]]
name = "host_material"
harness = false

[[test]]
name = "host_swapchain"
harness = false
